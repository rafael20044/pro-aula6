<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Preguntas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="questions-container">

    <div *ngIf="loading" class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando preguntas...</p>
    </div>

    <div *ngIf="!loading && questions.length === 0" class="empty-state">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <p>No hay preguntas publicadas.</p>
    </div>

    <div class="questions-grid" *ngIf="!loading && questions.length > 0">
      <div class="question-card" *ngFor="let q of questions">
        <div class="question-header">
          <div class="user-info">
            <div class="avatar-placeholder" *ngIf="!q.photo">{{ q.full_name.charAt(0) || 'U' }}</div>
            <img *ngIf="q.photo" [src]="q.photo" class="avatar-image" alt="Avatar">
            <span class="user-name">{{ q.full_name || 'Usuario desconocido' }}</span>
          </div>
          <ion-button fill="clear" color="danger" size="small" (click)="deleteQuestion(q)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </div>

        <div class="question-body">
          <h3>{{ q.title }}</h3>
          <p>{{ q.body | slice:0:150 }}{{ q.body.length > 150 ? '...' : '' }}</p>
        </div>

        <div class="question-footer">
          <span class="likes">
            <ion-icon name="thumbs-up"></ion-icon> {{ q.like_count }}
          </span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
