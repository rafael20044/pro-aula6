<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Etiquetas</ion-title>
    <ion-buttons slot="end" class="header-actions">
      <ion-button (click)="createTag()" class="add-button">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="tags-container">

    <div *ngIf="loading" class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando etiquetas...</p>
    </div>

    <div *ngIf="!loading && tags.length === 0" class="empty-state">
      <ion-icon name="pricetags-outline"></ion-icon>
      <p>No hay etiquetas creadas.</p>
    </div>

    <div class="tags-grid" *ngIf="!loading && tags.length > 0">
      <div class="tag-chip" *ngFor="let tag of tags">
        <div class="tag-content">
          <ion-icon name="pricetag-outline" class="tag-icon"></ion-icon>
          <span class="tag-name">{{ tag.name }}</span>
        </div>
        <button class="delete-btn" (click)="deleteTag(tag)">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>
    </div>
  </div>
</ion-content>
