<ion-header class="ion-no-border">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/admin/home"></ion-back-button>
        </ion-buttons>
        <ion-title>Respuestas</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div class="answers-container">
        <div *ngIf="loading" class="loading-state">
            <ion-spinner name="crescent"></ion-spinner>
            <p>Cargando respuestas...</p>
        </div>

        <div *ngIf="!loading && answers.length === 0" class="empty-state">
            <ion-icon name="chatbubbles-outline"></ion-icon>
            <p>No hay respuestas registradas.</p>
        </div>

        <div class="answers-grid" *ngIf="!loading && answers.length > 0">
            <div class="answer-card" *ngFor="let answer of answers">
                <div class="answer-header">
                    <div class="user-info">
                        <div class="avatar-placeholder" *ngIf="!answer.users?.photo">{{ answer.users?.name?.charAt(0) ||
                            'U' }}</div>
                        <img *ngIf="answer.users?.photo" [src]="answer.users.photo" class="avatar-image" alt="Avatar">
                        <span class="user-name">{{ answer.users?.name || 'Usuario desconocido' }}</span>
                    </div>
                    <span class="date">{{ answer.created_at | date:'mediumDate' }}</span>
                </div>

                <div class="answer-body">
                    <p>{{ answer.body }}</p>
                </div>

                <div class="answer-footer">
                    <p class="question-ref">
                        <ion-icon name="return-down-forward-outline"></ion-icon>
                        En respuesta a: <strong>{{ answer.questions?.title || 'Pregunta eliminada' }}</strong>
                    </p>
                    <ion-button fill="clear" color="danger" size="small" (click)="deleteAnswer(answer)">
                        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                    </ion-button>
                </div>
            </div>
        </div>
    </div>
</ion-content>
