      <app-home-c />
    </div>
  </ion-tab>
  <ion-tab tab="search">
    <div id="search-page">
      <app-search />
    </div>
  </ion-tab>
  <ion-tab tab="notifications">

      <app-notification />

    </ion-tab-button>
