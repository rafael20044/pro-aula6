<ion-content class="auth-content">
  <div class="auth-container">
    <div class="auth-card">
      <!-- Logo y Branding -->
      <div class="brand">
        <div class="logo-wrapper">
          <img src="assets/icon/logo.png" alt="Logo" class="logo" />
        </div>
        <h1 class="title">Bienvenido de nuevo</h1>
        <p class="subtitle">Inicia sesión para continuar</p>
      </div>

      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <div class="input-group">
          <app-input
            class="custom-input"
            [label]="'Correo electrónico'"
            [placeholder]="'tu@email.com'"
            type="email"
            [control]="emailControl">
          </app-input>
        </div>

        <div class="input-group">
          <app-input
            class="custom-input"
            [label]="'Contraseña'"
            [placeholder]="'••••••••'"
            type="password"
            [control]="passwordControl">
          </app-input>
        </div>

        <app-button
          class="submit-btn"
          [text]="'Iniciar sesión'"
          type="submit"
          [expand]="'block'"
        >
        </app-button>
      </form>

      <!-- Link a Registro -->
      <div class="alt-action">
        <span class="alt-text">¿No tienes cuenta?</span>
        <a routerLink="/auth/register" class="alt-link">Crear cuenta</a>
      </div>
    </div>
  </div>
</ion-content>
