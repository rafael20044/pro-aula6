<ion-content class="auth-content">
  <div class="auth-container">
    <div class="auth-card">
      <!-- Logo y Branding -->
      <div class="brand">
        <div class="logo-wrapper">
          <img src="assets/icon/logo.png" alt="Logo" class="logo" />
        </div>
        <h1 class="title">Crear cuenta</h1>
        <p class="subtitle">Únete a nuestra comunidad</p>
      </div>

      <!-- Formulario de usuario -->
      <app-user-form 
        [isRegistration]="true"
        (formSubmit)="onFormSubmit($event)">
      </app-user-form>

      <!-- Link a Login -->
      <div class="alt-action">
        <span class="alt-text">¿Ya tienes cuenta?</span>
        <a routerLink="/auth/login" class="alt-link">Inicia sesión</a>
      </div>
    </div>
  </div>
</ion-content>
