<ion-content class="auth-content">
  <div class="auth-container">
    <div class="auth-card">
      <!-- Logo y Branding -->
      <div class="brand">
        <div class="logo-wrapper">
          <img src="assets/icon/logo.png" alt="Logo" class="logo" />
        </div>
        <h1 class="title">Crear cuenta</h1>
        <p class="subtitle">Únete a nuestra comunidad</p>
      </div>

      <!-- Formulario -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <!-- Nombres -->
        <div class="input-row">
          <div class="input-group">
            <ion-label class="input-label">Primer nombre *</ion-label>
            <ion-input 
              class="custom-input"
              type="text" 
              placeholder="Juan"
              [formControl]="form.controls.name"
              fill="outline">
            </ion-input>
          </div>

          <div class="input-group">
            <ion-label class="input-label">Segundo nombre</ion-label>
            <ion-input 
              class="custom-input"
              type="text" 
              placeholder="Carlos"
              [formControl]="form.controls.name2"
              fill="outline">
            </ion-input>
          </div>
        </div>

        <!-- Apellidos -->
        <div class="input-row">
          <div class="input-group">
            <ion-label class="input-label">Primer apellido *</ion-label>
            <ion-input 
              class="custom-input"
              type="text" 
              placeholder="Pérez"
              [formControl]="form.controls.last_name"
              fill="outline">
            </ion-input>
          </div>

          <div class="input-group">
            <ion-label class="input-label">Segundo apellido</ion-label>
            <ion-input 
              class="custom-input"
              type="text" 
              placeholder="García"
              [formControl]="form.controls.last_name2"
              fill="outline">
            </ion-input>
          </div>
        </div>

        <!-- Email -->
        <div class="input-group">
          <ion-label class="input-label">Correo electrónico *</ion-label>
          <ion-input 
            class="custom-input"
            type="email" 
            placeholder="tu@email.com"
            [formControl]="form.controls.email"
            fill="outline">
          </ion-input>
        </div>

        <!-- Contraseña -->
        <div class="input-group">
          <ion-label class="input-label">Contraseña *</ion-label>
          <ion-input 
            class="custom-input"
            type="password" 
            placeholder="••••••••"
            [formControl]="form.controls.password"
            fill="outline">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="input-group">
          <ion-label class="input-label">Confirmar contraseña *</ion-label>
          <ion-input 
            class="custom-input"
            [class.password-match]="passwordsMatch && form.controls.confirmPassword.value"
            [class.password-mismatch]="!passwordsMatch && form.controls.confirmPassword.value"
            type="password" 
            placeholder="••••••••"
            [formControl]="form.controls.confirmPassword"
            fill="outline">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
          <ion-text *ngIf="!passwordsMatch && form.controls.confirmPassword.value" class="error-text">
            Las contraseñas no coinciden
          </ion-text>
        </div>

        <!-- Rol -->
        <div class="input-group">
          <ion-label class="input-label">Rol *</ion-label>
          <ion-select 
            class="custom-select"
            placeholder="Selecciona tu rol"
            [formControl]="form.controls.rol"
            interface="popover">
            <ion-select-option *ngFor="let rol of roles" [value]="rol">
              {{ rol }}
            </ion-select-option>
          </ion-select>
        </div>

        <ion-button 
          expand="block" 
          type="submit" 
          class="submit-btn"
          [disabled]="form.invalid">
          Crear cuenta
        </ion-button>
      </form>

      <!-- Link a Login -->
      <div class="alt-action">
        <span class="alt-text">¿Ya tienes cuenta?</span>
        <a routerLink="/auth/login" class="alt-link">Inicia sesión</a>
      </div>
    </div>
  </div>
</ion-content>
