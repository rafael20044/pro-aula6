
<ion-content [fullscreen]="true" class="profile-content">
  <div class="page">
    <div class="profile-container">
      <div class="profile-header">
        <div class="profile-avatar">
          <ng-container *ngIf="avatarUrl; else initialsBig">
            <img [src]="avatarUrl" alt="Foto de perfil" class="avatar" />
          </ng-container>
          <ng-template #initialsBig>
            <div class="avatar-initials">{{ initials }}</div>
          </ng-template>
        </div>
        <div class="header-controls">
          <ion-button size="small" fill="clear" class="edit-profile-btn">
            <ion-icon name="create-outline" slot="start" aria-hidden="true"></ion-icon>
            <span>Editar perfil</span>
          </ion-button>
        </div>
      </div>

      <div class="profile-main">
        <div class="identity-row">
          <div class="identity">
            <h2 class="full-name">{{ fullName }}</h2>
            <div class="username">{{ username }}</div>
          </div>
        </div>

        <div class="bio" *ngIf="location || birthdate">
          <span *ngIf="location">{{ location }}</span>
          <span *ngIf="birthdate"> • {{ birthdate }}</span>
        </div>

        <div class="meta">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>{{ joinedDate }}</span>
        </div>

        <div class="profile-separator"></div>

        <div class="questions-placeholder">Tus preguntas aparecerán aquí.</div>
      </div>
    </div>
  </div>
  
  <!-- Logout FAB shown only on profile page -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="profile-logout-fab">
    <ion-fab-button (click)="confirmSignOut()" title="Cerrar sesión">
      <ion-icon name="log-out-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
