<form [formGroup]="form" (ngSubmit)="submit()" class="user-form">
  
  

  <!-- Nombres -->
  <div class="input-row">
    <div class="input-group">
      <app-input
        class="custom-input"
        [label]="'Primer nombre *'"
        [placeholder]="'Juan'"
        [type]="'text'"
        [control]="nameControl">
      </app-input>
    </div>

    <div class="input-group">
      <app-input
        class="custom-input"
        [label]="'Segundo nombre'"
        [placeholder]="'Carlos'"
        [type]="'text'"
        [control]="name2Control">
      </app-input>
    </div>
  </div>

  <!-- Apellidos -->
  <div class="input-row">
    <div class="input-group">
      <app-input
        class="custom-input"
        [label]="'Primer apellido *'"
        [placeholder]="'Pérez'"
        [type]="'text'"
        [control]="lastNameControl">
      </app-input>
    </div>

    <div class="input-group">
      <app-input
        class="custom-input"
        [label]="'Segundo apellido'"
        [placeholder]="'García'"
        [type]="'text'"
        [control]="lastName2Control">
      </app-input>
    </div>
  </div>

  <!-- Email -->
  <div class="input-group">
    <app-input
      class="custom-input"
      [label]="'Correo electrónico *'"
      [placeholder]="'tu@email.com'"
      [type]="'email'"
      [control]="emailControl">
    </app-input>
  </div>

  <!-- Contraseñas (solo en registro) -->
  <ng-container *ngIf="isRegistration">
    <div class="input-group">
      <app-input
        class="custom-input"
        [label]="'Contraseña *'"
        [placeholder]="'••••••••'"
        [type]="'password'"
        [control]="passwordControl">
      </app-input>
    </div>

    <div class="input-group">
      <app-input
        class="custom-input"
        [label]="'Confirmar contraseña *'"
        [placeholder]="'••••••••'"
        [type]="'password'"
        [control]="confirmPasswordControl"
        [ngClass]="{ 'password-match': passwordsMatch && confirmPasswordControl.value, 'password-mismatch': !passwordsMatch && confirmPasswordControl.value }">
      </app-input>
      <ion-text *ngIf="!passwordsMatch && form.get('confirmPassword')?.value" class="error-text">
        Las contraseñas no coinciden
      </ion-text>
    </div>
  </ng-container>

  <!-- Rol -->
  <div class="input-group">
    <ion-label class="input-label">Rol *</ion-label>
    <ion-select 
      class="custom-select"
      placeholder="Selecciona tu rol"
      formControlName="rol"
      interface="popover">
      <ion-select-option *ngFor="let rol of roles" [value]="rol">
        {{ rol }}
      </ion-select-option>
    </ion-select>
  </div>
  <!-- Sección de foto de perfil -->
  <div class="photo-section">
    <div class="photo-header input-group">
        <ion-label class="input-label">Foto de perfil *</ion-label>
        <div class="photo-action">
          <!-- external remove button placed top-right when a photo exists -->
          <button *ngIf="profilePhoto" type="button" class="photo-remove-external" (click)="removePhoto()" title="Eliminar foto">
            <ion-icon name="close"></ion-icon>
          </button>
        </div>
      </div>
    <div class="photo-card" *ngIf="profilePhoto; else uploadPrompt">
      <img [src]="profilePhoto" alt="Foto de perfil" class="photo-card__image" />
      <button
        type="button"
        class="photo-card__remove"
        title="Eliminar foto"
        (click)="removePhoto()">
        <ion-icon name="close"></ion-icon>
      </button>
      <!-- subtitle removed to keep only the photo (was 'Avatar') -->
    </div>
    
    <ng-template #uploadPrompt>
      <div class="upload-buttons">
        <app-button class="upload-btn camera" [text]="'TOMAR FOTO'" [action]="triggerCamera.bind(this)" [type]="'button'" [icon]="'camera'" [expand]="'block'"></app-button>

        <app-button class="upload-btn gallery" [text]="'SELECCIONAR DE LA GALERÍA'" [action]="triggerGallery.bind(this)" [type]="'button'" [icon]="'images'" [expand]="'block'"></app-button>
      </div>

      <!-- Hidden inputs: camera uses capture attribute to hint mobile devices to open camera -->
      <input #cameraInput id="photo-camera" type="file" accept="image/*" (change)="onFileSelected($event)" class="photo-upload__input" title="Subir foto con cámara" aria-label="Subir foto con cámara" />
      <input #galleryInput id="photo-gallery" type="file" accept="image/*" (change)="onFileSelected($event)" class="photo-upload__input" title="Seleccionar foto de la galería" aria-label="Seleccionar foto de la galería" />
    </ng-template>
  </div>
  
  <!-- Botón submit -->
  <app-button
    class="submit-btn"
    [text]="isRegistration ? 'Crear cuenta' : 'Guardar cambios'"
    [action]="submit.bind(this)"
    [type]="'submit'"
    [expand]="'block'">
  </app-button>
</form>
