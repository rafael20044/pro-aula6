<form [formGroup]="form" (ngSubmit)="submit()" class="user-form">
  
  

  <!-- Nombres -->
  <div class="input-row">
    <div class="input-group">
      <ion-label class="input-label">Primer nombre *</ion-label>
      <ion-input 
        class="custom-input"
        type="text" 
        placeholder="Juan"
        formControlName="name"
        fill="outline">
      </ion-input>
    </div>

    <div class="input-group">
      <ion-label class="input-label">Segundo nombre</ion-label>
      <ion-input 
        class="custom-input"
        type="text" 
        placeholder="Carlos"
        formControlName="name2"
        fill="outline">
      </ion-input>
    </div>
  </div>

  <!-- Apellidos -->
  <div class="input-row">
    <div class="input-group">
      <ion-label class="input-label">Primer apellido *</ion-label>
      <ion-input 
        class="custom-input"
        type="text" 
        placeholder="Pérez"
        formControlName="last_name"
        fill="outline">
      </ion-input>
    </div>

    <div class="input-group">
      <ion-label class="input-label">Segundo apellido</ion-label>
      <ion-input 
        class="custom-input"
        type="text" 
        placeholder="García"
        formControlName="last_name2"
        fill="outline">
      </ion-input>
    </div>
  </div>

  <!-- Email -->
  <div class="input-group">
    <ion-label class="input-label">Correo electrónico *</ion-label>
    <ion-input 
      class="custom-input"
      type="email" 
      placeholder="tu@email.com"
      formControlName="email"
      fill="outline">
    </ion-input>
  </div>

  <!-- Contraseñas (solo en registro) -->
  <ng-container *ngIf="isRegistration">
    <div class="input-group">
      <ion-label class="input-label">Contraseña *</ion-label>
      <ion-input 
        class="custom-input"
        type="password" 
        placeholder="••••••••"
        formControlName="password"
        fill="outline">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </div>

    <div class="input-group">
      <ion-label class="input-label">Confirmar contraseña *</ion-label>
      <ion-input 
        class="custom-input"
        [class.password-match]="passwordsMatch && form.get('confirmPassword')?.value"
        [class.password-mismatch]="!passwordsMatch && form.get('confirmPassword')?.value"
        type="password" 
        placeholder="••••••••"
        formControlName="confirmPassword"
        fill="outline">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
      <ion-text *ngIf="!passwordsMatch && form.get('confirmPassword')?.value" class="error-text">
        Las contraseñas no coinciden
      </ion-text>
    </div>
  </ng-container>

  <!-- Rol -->
  <div class="input-group">
    <ion-label class="input-label">Rol *</ion-label>
    <ion-select 
      class="custom-select"
      placeholder="Selecciona tu rol"
      formControlName="rol"
      interface="popover">
      <ion-select-option *ngFor="let rol of roles" [value]="rol">
        {{ rol }}
      </ion-select-option>
    </ion-select>
  </div>
  <!-- Sección de foto de perfil -->
  <div class="photo-section">
    <div class="photo-label">
      <label class="input-label">Foto de perfil *</label>
    </div>
    <div class="photo-card" *ngIf="profilePhoto; else uploadPrompt">
      <img [src]="profilePhoto" alt="Foto de perfil" class="photo-card__image" />
      <button
        type="button"
        class="photo-card__remove"
        title="Eliminar foto"
        (click)="removePhoto()">
        <ion-icon name="close"></ion-icon>
      </button>
      <span class="photo-card__badge" *ngIf="isPrimaryPhoto()">
        Avatar
      </span>
    </div>
    
    <ng-template #uploadPrompt>
      <div class="upload-buttons">
        <button type="button" class="upload-btn camera" (click)="triggerCamera()">
          <ion-icon name="camera"></ion-icon>
          <span>TOMAR FOTO</span>
        </button>

        <button type="button" class="upload-btn gallery" (click)="triggerGallery()">
          <ion-icon name="images"></ion-icon>
          <span>SELECCIONAR DE LA GALERÍA</span>
        </button>
      </div>

      <!-- Hidden inputs: camera uses capture attribute to hint mobile devices to open camera -->
  <input #cameraInput id="photo-camera" type="file" accept="image/*" (change)="onFileSelected($event)" class="photo-upload__input" title="Subir foto con cámara" aria-label="Subir foto con cámara" />
  <input #galleryInput id="photo-gallery" type="file" accept="image/*" (change)="onFileSelected($event)" class="photo-upload__input" title="Seleccionar foto de la galería" aria-label="Seleccionar foto de la galería" />
    </ng-template>
  </div>
  
  <!-- Botón submit -->
  <ion-button 
    expand="block" 
    type="submit" 
    class="submit-btn"
    [disabled]="form.invalid">
    {{ isRegistration ? 'Crear cuenta' : 'Guardar cambios' }}
  </ion-button>
</form>
