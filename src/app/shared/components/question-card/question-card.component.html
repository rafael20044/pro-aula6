<ion-card class="question-card" (click)="goToDetaiss()">
  <ion-card-content class="card-content">
    <!-- Header: avatar + name + username en una sola línea -->
    <div class="card-header">
      <div class="avatar-small">
        <ng-container *ngIf="avatarUrl; else initialsSmall">
          <img [src]="avatarUrl" alt="avatar" />
        </ng-container>
        <ng-template #initialsSmall>
          <div class="initials">{{ (question.full_name || '').slice(0,2).toUpperCase() }}</div>
        </ng-template>
      </div>
      <div class="user-info">
        <span class="name">{{ question.full_name }}</span>
        <span class="username">{{ handle ? ('@' + handle) : ('@' + question.user_id) }}</span>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="card-body">
      <h3 class="title">{{ question.title }}</h3>
      <p class="body">{{ question.body }}</p>
  
      <!-- Imágenes -->
      <div class="images" *ngIf="imageUrls.length">
        <img *ngFor="let src of imageUrls" [src]="src" alt="question image" />
      </div>
      
      <!-- Tags estilo pill -->
      <div class="tags" *ngIf="question.tags.length">
        <span class="tag" *ngFor="let t of question.tags; trackBy: trackTag">{{ t }}</span>
      </div>
    </div>

    <!-- Footer con botones de interacción -->
    <div class="card-footer" (click)="$event.stopPropagation()">
      <button class="action-btn" (click)="onLike()">
        <ion-icon name="thumbs-up-outline"></ion-icon>
        <span>{{ getLikeCount() }}</span>
      </button>
      <button class="action-btn" (click)="onDislike()">
        <ion-icon name="thumbs-down-outline"></ion-icon>
        <span>{{ getDislikeCount() }}</span>
      </button>
      <button class="action-btn" (click)="onComment()">
        <ion-icon name="chatbubble-outline"></ion-icon>
        <span>{{ getAnswerCount() }}</span>
      </button>
    </div>
  </ion-card-content>
</ion-card>
